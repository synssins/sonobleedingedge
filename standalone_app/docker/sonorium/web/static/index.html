<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonorium</title>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="logo">Sonorium</h1>
            </div>
            <div class="header-center">
                <div class="master-volume">
                    <label for="master-volume">Master</label>
                    <input type="range" id="master-volume" min="0" max="100" value="80">
                    <span id="master-volume-value">80%</span>
                </div>
            </div>
            <div class="header-right">
                <button id="btn-settings" class="btn-icon" title="Settings">
                    <span class="icon">&#9881;</span>
                </button>
                <span id="connection-status" class="status online">Connected</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Speakers Panel -->
            <section class="panel speakers-panel">
                <div class="panel-header">
                    <h2>Speakers</h2>
                    <div class="panel-actions">
                        <button id="btn-discover" class="btn-secondary" title="Discover Speakers">
                            Discover
                        </button>
                        <button id="btn-enable-all" class="btn-secondary" title="Enable All">
                            Enable All
                        </button>
                        <button id="btn-disable-all" class="btn-secondary" title="Disable All">
                            Disable All
                        </button>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="speakers-list" class="speakers-list">
                        <!-- Speakers loaded dynamically -->
                        <div class="empty-state">No speakers discovered</div>
                    </div>
                </div>
            </section>

            <!-- Themes Panel -->
            <section class="panel themes-panel">
                <div class="panel-header">
                    <h2>Themes</h2>
                    <div class="panel-actions">
                        <input type="text" id="theme-search" placeholder="Search themes..." class="search-input">
                        <select id="theme-category" class="category-select">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="themes-list" class="themes-list">
                        <!-- Themes loaded dynamically -->
                        <div class="empty-state">No themes found</div>
                    </div>
                </div>
            </section>

            <!-- Now Playing Panel -->
            <section class="panel nowplaying-panel">
                <div class="panel-header">
                    <h2>Now Playing</h2>
                    <div class="panel-actions">
                        <button id="btn-stop-all" class="btn-danger" title="Stop All">
                            Stop All
                        </button>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="sessions-list" class="sessions-list">
                        <!-- Active sessions loaded dynamically -->
                        <div class="empty-state">Nothing playing</div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Theme Detail Modal -->
        <div id="theme-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="theme-modal-title">Theme Details</h2>
                    <button class="btn-close" onclick="closeThemeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="theme-tracks" class="track-list">
                        <!-- Tracks loaded dynamically -->
                    </div>
                    <div id="theme-presets" class="presets-section">
                        <h3>Presets</h3>
                        <div id="presets-list" class="presets-list">
                            <!-- Presets loaded dynamically -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="btn-play-theme" class="btn-primary">Play Theme</button>
                    <button id="btn-cancel" class="btn-secondary" onclick="closeThemeModal()">Close</button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="btn-close" onclick="closeSettingsModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h3>MQTT</h3>
                        <div class="setting-row">
                            <label for="mqtt-enabled">Enable MQTT</label>
                            <input type="checkbox" id="mqtt-enabled">
                        </div>
                        <div class="setting-row">
                            <label for="mqtt-host">Host</label>
                            <input type="text" id="mqtt-host" placeholder="localhost">
                        </div>
                        <div class="setting-row">
                            <label for="mqtt-port">Port</label>
                            <input type="number" id="mqtt-port" value="1883">
                        </div>
                    </div>
                    <div class="settings-section">
                        <h3>Discovery</h3>
                        <div class="setting-row">
                            <label for="discovery-interval">Interval (seconds)</label>
                            <input type="number" id="discovery-interval" value="300">
                        </div>
                    </div>
                    <div class="settings-section">
                        <h3>Audio</h3>
                        <div class="setting-row">
                            <label for="default-volume">Default Volume</label>
                            <input type="range" id="default-volume" min="0" max="100" value="80">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="btn-save-settings" class="btn-primary">Save</button>
                    <button class="btn-secondary" onclick="closeSettingsModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="static/js/api.js"></script>
    <script src="static/js/app.js"></script>
</body>
</html>
