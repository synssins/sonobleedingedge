name: SonoBleedingEdge
version: "0.0.74"
slug: sonobleedingedge
description: "Multi-zone ambient soundscape mixer for Home Assistant"
url: https://github.com/synssins/sonobleedingedge

arch:
  - aarch64
  - amd64

init: false
homeassistant_api: true
hassio_api: true
audio: false

# Host network required for mDNS/SSDP speaker discovery
host_network: true

# Ingress - enables sidebar integration
ingress: true
ingress_port: 8008
ingress_stream: true
panel_icon: mdi:music-circle
panel_title: Sonorium

services:
  - mqtt:need

map:
  - media:rw
  - config:rw

ports:
  8008/tcp: 8008
ports_description:
  8008/tcp: "Sonorium Web UI and streaming API (direct access)"

options:
  sonorium__port: 8008
  sonorium__stream_url: "auto"
  sonorium__path_audio: "/media/sonorium"
  sonorium__max_channels: 6
  sonorium__log_level: "info"
  sonorium__mqtt_host: "auto"
  sonorium__mqtt_port: 0
  sonorium__mqtt_username: ""
  sonorium__mqtt_password: ""

schema:
  sonorium__port: port
  sonorium__stream_url: str?
  sonorium__path_audio: str
  sonorium__max_channels: int(1,10)
  sonorium__log_level: list(debug|info|warning|error)?
  sonorium__mqtt_host: str?
  sonorium__mqtt_port: int?
  sonorium__mqtt_username: str?
  sonorium__mqtt_password: str?

startup: application
stage: stable

# Direct web UI access (bypasses ingress)
webui: http://[HOST]:[PORT:8008]/
