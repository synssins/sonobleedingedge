name: Sonorium
version: "0.1.3"
slug: sonorium
description: Multi-zone ambient soundscape mixer for Home Assistant
url: https://github.com/synssins/sonobleedingedge
arch:
  - amd64
  - aarch64
  - armv7
init: false
homeassistant_api: true
hassio_api: true
map:
  - type: share
    read_only: false
  - type: media
    read_only: true
ports:
  8008/tcp: 8008
ports_description:
  8008/tcp: Web UI
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)
