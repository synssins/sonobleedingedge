name: Sonorium
version: "0.1.5"
slug: sonorium
description: Multi-zone ambient soundscape mixer for Home Assistant
url: https://github.com/synssins/sonobleedingedge
arch:
  - amd64
  - aarch64
  - armv7
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8008
ingress_stream: true
panel_icon: mdi:speaker-multiple
panel_title: Sonorium
map:
  - type: share
    read_only: false
  - type: media
    read_only: true
ports:
  8008/tcp: 8008
ports_description:
  8008/tcp: Web UI (direct access)
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)
