name: Sync Version

# Automatically sync version from shared/sonorium/VERSION to all deployment targets
# when the VERSION file is updated.

on:
  push:
    branches:
      - main
    paths:
      - 'shared/sonorium/VERSION'

jobs:
  sync-version:
    runs-on: ubuntu-latest

    # Don't run on commits made by this action (prevents infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat shared/sonorium/VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Update sonorium_addon/config.yaml
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Update version in config.yaml using sed
          # Matches: version: "x.x.x" or version: 'x.x.x' or version: x.x.x
          sed -i "s/^version: .*/version: \"$VERSION\"/" sonorium_addon/config.yaml

          echo "Updated sonorium_addon/config.yaml to version $VERSION"
          grep "^version:" sonorium_addon/config.yaml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --name-only
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: sync version to $VERSION [skip ci]"
          git push

          echo "Version synced to $VERSION and pushed"
